<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Web API Admin</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 2rem; max-width: 920px; }
      input, textarea, button { font: inherit; padding: .6rem; margin: .25rem 0; width: 100%; box-sizing: border-box; }
      button { cursor: pointer; background: #111827; color: white; border: 0; border-radius: .5rem; }
      code, pre { background: #f3f4f6; padding: .75rem; display: block; overflow: auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    </style>
  </head>
  <body>
    <h1>Gemini Web API Admin</h1>
    <p>Use these helpers to list accounts and add Gemini cookies. Configure API keys in production.</p>
    <div class="grid">
      <section>
        <h2>Add cookie</h2>
        <input id="id" placeholder="Account id (optional)" />
        <textarea id="psid" placeholder="__Secure-1PSID" rows="3"></textarea>
        <textarea id="psidts" placeholder="__Secure-1PSIDTS (optional)" rows="3"></textarea>
        <button onclick="addCookie()">Add</button>
      </section>
      <section>
        <h2>Accounts</h2>
        <button onclick="loadAccounts()">Refresh</button>
        <pre id="accounts">[]</pre>
      </section>
    </div>
    <script>
      async function loadAccounts() {
        const res = await fetch('/admin/accounts');
        document.getElementById('accounts').textContent = JSON.stringify(await res.json(), null, 2);
      }
      async function addCookie() {
        const body = {
          id: document.getElementById('id').value || null,
          secure_1psid: document.getElementById('psid').value,
          secure_1psidts: document.getElementById('psidts').value
        };
        const res = await fetch('/admin/cookies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        document.getElementById('accounts').textContent = JSON.stringify(await res.json(), null, 2);
      }
      loadAccounts();
    </script>
  </body>
</html>
